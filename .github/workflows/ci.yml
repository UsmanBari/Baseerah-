name: Baseerah Kiosk CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Quran Build Pipeline & Integrity
        run: |
          python -m unittest tests/test_build.py
          python -m unittest tests/test_kiosk.py

      - name: Check Arabic Script Allowlist (No Hand-Typed Content)
        run: |
          python scripts/check_arabic_allowlist.py

      - name: Validate SHA-256 Manifest
        run: |
          python -c "
          import json, hashlib, os
          with open('data/manifest.sha256.json', 'r', encoding='utf-8') as f:
              manifest = json.load(f)
          for path, expected_hash in manifest.items():
              if not os.path.exists(path):
                  continue
              with open(path, 'rb') as f:
                  actual = hashlib.sha256(f.read().replace(b'\r\n', b'\n')).hexdigest()
              # Allow either raw or normalized match
              with open(path, 'rb') as f:
                  raw_actual = hashlib.sha256(f.read()).hexdigest()
              assert expected_hash in (actual, raw_actual), f'Hash mismatch on {path}'
          print('All manifest files verified.')
          "

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Test Suite
        run: |
          npx playwright test
